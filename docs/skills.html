<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技能库 | flp516</title>
<meta name="description" content="OpenClaw 技能库 - 116 个技能全覆盖 · 搜索 · 分类筛选">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  background:#000;color:#fff;line-height:1.5;-webkit-font-smoothing:antialiased;
  min-height:100vh
}
/* Navigation */
nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;height:48px;
  background:rgba(0,0,0,0.8);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  display:flex;align-items:center;justify-content:center
}
.nav-content{max-width:1200px;width:100%;padding:0 22px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:21px;font-weight:600;color:#fff;text-decoration:none;letter-spacing:-.02em}
.nav-links{display:flex;gap:32px;list-style:none}
.nav-links a{color:#fff;text-decoration:none;font-size:12px;font-weight:400;transition:opacity .3s}
.nav-links a:hover{opacity:.7}
.nav-links a.active{color:#2997ff}

/* Hero */
.hero{min-height:38vh;display:flex;align-items:center;justify-content:center;padding:120px 22px 50px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 20%,rgba(41,151,255,0.08) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(0,113,227,0.06) 0%,transparent 50%);pointer-events:none}
.hero-content{position:relative;z-index:1}
.hero h1{font-size:52px;font-weight:700;line-height:1.1;letter-spacing:-.28px;margin-bottom:12px;background:linear-gradient(135deg,#fff 30%,#2997ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{font-size:18px;font-weight:400;color:rgba(255,255,255,.6);margin-bottom:28px;max-width:500px;margin-left:auto;margin-right:auto}
.stats-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:700px;margin:0 auto}
.stat-pill{padding:6px 16px;border-radius:980px;font-size:12px;font-weight:500;background:rgba(255,255,255,.05);color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.07);transition:all .2s}
.stat-pill strong{color:#2997ff;font-weight:600}

/* Controls */
.controls{background:#000;padding:16px 22px 24px;position:sticky;top:48px;z-index:100;border-bottom:1px solid rgba(255,255,255,.05)}
.controls-inner{max-width:1200px;margin:0 auto}
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:rgba(255,255,255,.25);pointer-events:none}
.search-input{
  width:100%;padding:12px 16px 12px 42px;border-radius:10px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);color:#fff;font-size:14px;font-family:inherit;
  outline:none;transition:border-color .3s,background .3s
}
.search-input:focus{border-color:rgba(41,151,255,.5);background:rgba(255,255,255,.07)}
.search-input::placeholder{color:rgba(255,255,255,.25)}
.filter-row{display:flex;flex-wrap:wrap;gap:5px}
.filter-btn{
  padding:5px 12px;border-radius:980px;border:1px solid rgba(255,255,255,.1);
  background:transparent;color:rgba(255,255,255,.6);font-size:11px;font-weight:500;
  font-family:inherit;cursor:pointer;transition:all .2s;white-space:nowrap;line-height:1.4
}
.filter-btn:hover{border-color:rgba(41,151,255,.4);color:#fff}
.filter-btn.active{background:#2997ff;border-color:#2997ff;color:#fff}

/* Grid */
.grid-container{max-width:1200px;margin:0 auto;padding:28px 22px 60px}
.grid-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.grid-info h2{font-size:16px;font-weight:600;color:rgba(255,255,255,.85)}
.grid-info .count{font-size:13px;color:rgba(255,255,255,.4)}
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}

/* Card */
.skill-card{
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);
  border-radius:14px;padding:18px;cursor:pointer;transition:all .25s;
  position:relative;overflow:hidden
}
.skill-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#2997ff,#0071e3);opacity:0;transition:opacity .25s}
.skill-card:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);transform:translateY(-1px)}
.skill-card:hover::before{opacity:.8}
.skill-card-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px}
.skill-card-emoji{font-size:24px;line-height:1;flex-shrink:0;margin-top:1px}
.skill-card-meta{flex:1;min-width:0}
.skill-card-name{font-size:14px;font-weight:600;color:#fff;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skill-card-dir{font-size:11px;color:rgba(255,255,255,.3);font-family:'SF Mono','Menlo','Cascadia Code',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skill-card-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:600;background:rgba(41,151,255,.1);color:#2997ff;margin-bottom:6px;letter-spacing:.2px}
.skill-card-desc{font-size:12px;color:rgba(255,255,255,.5);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.skill-card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.03)}
.skill-card-source{font-size:10px;color:rgba(255,255,255,.25)}
.skill-card-expand{font-size:11px;color:#2997ff;font-weight:500;opacity:.6;transition:opacity .2s}
.skill-card:hover .skill-card-expand{opacity:1}

/* Expanded */
.skill-card.expanded{background:rgba(255,255,255,.06);border-color:rgba(41,151,255,.15)}
.skill-card.expanded::before{opacity:1}
.skill-detail{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.06);display:none}
.skill-card.expanded .skill-detail{display:block}
.skill-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.skill-detail-label{font-size:10px;font-weight:600;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.skill-detail-value{font-size:12px;color:rgba(255,255,255,.65);word-break:break-all}
.skill-detail-value a{color:#2997ff;text-decoration:none}
.skill-detail-value a:hover{text-decoration:underline}
.skill-commands{margin-bottom:10px}
.skill-commands-label{font-size:10px;font-weight:600;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.skill-command-code{display:block;padding:7px 10px;background:rgba(0,0,0,.3);border-radius:6px;font-family:'SF Mono','Menlo','Cascadia Code',monospace;font-size:11px;color:rgba(255,255,255,.5);margin-bottom:5px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;line-height:1.4}

/* Empty */
.empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.35)}
.empty-state h3{font-size:16px;font-weight:600;margin-bottom:6px;color:rgba(255,255,255,.5)}
.empty-state p{font-size:13px}

/* Footer */
footer{text-align:center;padding:28px 22px;color:rgba(255,255,255,.18);font-size:11px;border-top:1px solid rgba(255,255,255,.03)}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.skill-card{animation:fadeUp .4s ease both}
.skill-card:nth-child(1){animation-delay:0s}
.skill-card:nth-child(2){animation-delay:.03s}
.skill-card:nth-child(3){animation-delay:.06s}
.skill-card:nth-child(4){animation-delay:.09s}

/* Source link & download button */
.skill-card-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.skill-card-source-link{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:500;background:rgba(41,151,255,.1);color:#2997ff;text-decoration:none;transition:all .2s}
.skill-card-source-link:hover{background:rgba(41,151,255,.2)}
.skill-card-download{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:500;background:rgba(52,199,89,.1);color:#34c759;text-decoration:none;cursor:pointer;transition:all .2s;border:none;font-family:inherit}
.skill-card-download:hover{background:rgba(52,199,89,.2)}
.skill-card-download.copied{background:rgba(255,149,0,.15);color:#ff9500}
.skill-detail-extras{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)}
.skill-detail-tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;margin-right:4px;margin-bottom:4px}
.skill-detail-tag.paid{background:rgba(255,69,58,.12);color:#ff453a}
.skill-detail-tag.free{background:rgba(52,199,89,.12);color:#34c759}
.skill-detail-tag.account{background:rgba(255,149,0,.12);color:#ff9500}
.skill-detail-tag.noaccount{background:rgba(90,200,250,.12);color:#5ac8fa}

@media(max-width:768px){
  .hero h1{font-size:32px}
  .hero p{font-size:15px}
  .hero{padding:100px 16px 40px}
  .skill-grid{grid-template-columns:1fr}
  .skill-detail-grid{grid-template-columns:1fr}
  .nav-links{gap:14px}
}
</style>
</head>
<body>

<nav>
  <div class="nav-content">
    <a href="index.html" class="logo">flp516</a>
    <ul class="nav-links">
      <li><a href="index.html">首页</a></li>
      <li><a href="skills.html" class="active">技能库</a></li>
    </ul>
  </div>
</nav>

<section class="hero">
  <div class="hero-content">
    <h1>技能库</h1>
    <p>全部 OpenClaw 技能一览</p>
    <div class="stats-bar" id="statsBar"></div>
  </div>
</section>

<section class="controls">
  <div class="controls-inner">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="searchInput" type="text" placeholder="搜索技能名称、描述、目录..." autocomplete="off">
    </div>
    <div class="filter-row" id="filterRow"></div>
  </div>
</section>

<section class="grid-container">
  <div class="grid-info">
    <h2>全部技能</h2>
    <span class="count" id="resultCount">加载中...</span>
  </div>
  <div class="skill-grid" id="skillGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <h3>没有找到匹配的技能</h3>
    <p>请尝试更换搜索关键词或清除筛选条件</p>
  </div>
</section>

<footer>
  &copy; 2026 flp516 &middot; OpenClaw Skills Knowledge Base &middot; Built with &#9829;
</footer>

<script src="skills-data.js"></script>
<script>
(function(){
  let currentFilter = 'all';
  let currentSearch = '';

  // Build stats bar
  function buildStats() {
    const bar = document.getElementById('statsBar');
    const total = SKILLS_DATA.length;
    const cats = CATEGORIES.length;
    const catCounts = {};
    SKILLS_DATA.forEach(function(s){ catCounts[s.c] = (catCounts[s.c] || 0) + 1; });
    var entries = Object.entries(catCounts).sort(function(a,b){return b[1]-a[1];}).slice(0,3);
    var html = '<span class="stat-pill"><strong>' + total + '</strong> 个技能</span>';
    html += '<span class="stat-pill"><strong>' + cats + '</strong> 个分类</span>';
    for (var i=0; i<entries.length; i++) {
      var name = entries[i][0];
      var count = entries[i][1];
      var e = CAT_EMOJI[name] || '';
      var label = name.replace(/^.{1,2}/, e || '');
      html += '<span class="stat-pill">' + e + ' ' + label.split(' ').slice(1).join(' ') + ' <strong>' + count + '</strong></span>';
    }
    bar.innerHTML = html;
  }

  // Build filter buttons
  function buildFilters() {
    var row = document.getElementById('filterRow');
    var html = '<button class="filter-btn active" data-cat="all">全部</button>';
    for (var i=0; i<CATEGORIES.length; i++) {
      var c = CATEGORIES[i];
      var e = CAT_EMOJI[c] || '';
      var label = c.replace(/^.{1,2}/, e || '');
      html += '<button class="filter-btn" data-cat="' + c.replace(/"/g, '&quot;') + '">' + label + '</button>';
    }
    row.innerHTML = html;
    row.addEventListener('click', function(e) {
      var btn = e.target.closest('.filter-btn');
      if (!btn) return;
      var btns = row.querySelectorAll('.filter-btn');
      for (var i=0; i<btns.length; i++) btns[i].classList.remove('active');
      btn.classList.add('active');
      currentFilter = btn.getAttribute('data-cat');
      renderGrid();
    });
  }

  // Render grid
  function renderGrid() {
    var grid = document.getElementById('skillGrid');
    var empty = document.getElementById('emptyState');
    var count = document.getElementById('resultCount');

    var filtered = [];
    for (var i=0; i<SKILLS_DATA.length; i++) {
      var s = SKILLS_DATA[i];
      if (currentFilter !== 'all' && s.c !== currentFilter) continue;
      if (currentSearch) {
        var q = currentSearch.toLowerCase();
        if (s.n.toLowerCase().indexOf(q) === -1 &&
            s.desc.toLowerCase().indexOf(q) === -1 &&
            s.d.toLowerCase().indexOf(q) === -1 &&
            s.c.toLowerCase().indexOf(q) === -1) continue;
      }
      filtered.push(s);
    }

    if (filtered.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      count.textContent = '0 个技能';
      return;
    }
    empty.style.display = 'none';
    count.textContent = filtered.length + ' 个技能';

    var html = '';
    for (var i=0; i<filtered.length; i++) {
      var s = filtered[i];
      var cmd1 = s.cmds && s.cmds[0] ? escapeHtml(s.cmds[0]) : '';
      var cmd2 = s.cmds && s.cmds[1] ? escapeHtml(s.cmds[1]) : '';
      var hp = s.h || '-';
      var srcUrl = s.source_url || '';
      var zipFile = s.zip_file || '';
      var installCmd = s.install_cmd || '';

      html += '<div class="skill-card" onclick="toggleCard(this)">';
      html += '<div class="skill-card-header">';
      html += '<span class="skill-card-emoji">' + s.e + '</span>';
      html += '<div class="skill-card-meta">';
      html += '<div class="skill-card-name">' + escapeHtml(s.n) + '</div>';
      html += '<div class="skill-card-dir">' + escapeHtml(s.d) + '</div>';
      html += '</div></div>';
      html += '<div class="skill-card-badge">' + s.c + '</div>';
      html += '<div class="skill-card-desc">' + escapeHtml(s.desc || '') + '</div>';
      // Actions: source link + download
      html += '<div class="skill-card-actions">';
      if (srcUrl) {
        html += '<a href="' + srcUrl + '" target="_blank" rel="noopener" class="skill-card-source-link" onclick="event.stopPropagation()">🔗 来源</a>';
      }
      if (zipFile) {
        html += '<a href="' + zipFile + '" download class="skill-card-download" onclick="event.stopPropagation()">⬇️ 下载安装包</a>';
      } else if (installCmd) {
        html += '<button class="skill-card-download" onclick="event.stopPropagation(); copyInstallCmd(this,' + JSON.stringify(installCmd) + ')">📋 复制安装命令</button>';
      }
      html += '</div>';
      html += '<div class="skill-card-bottom">';
      html += '<span class="skill-card-source">' + escapeHtml(s.src) + '</span>';
      html += '<span class="skill-card-expand">查看详情</span>';
      html += '</div>';
      html += '<div class="skill-detail">';
      html += '<div class="skill-detail-grid">';
      html += '<div class="skill-detail-item"><div class="skill-detail-label">来源</div><div class="skill-detail-value">' + escapeHtml(s.src || '-') + '</div></div>';
      html += '<div class="skill-detail-item"><div class="skill-detail-label">所属</div><div class="skill-detail-value">' + escapeHtml(s.author_org || '-') + '</div></div>';
      html += '<div class="skill-detail-item"><div class="skill-detail-label">目录</div><div class="skill-detail-value">' + escapeHtml(s.d) + '</div></div>';
      html += '<div class="skill-detail-item"><div class="skill-detail-label">分类</div><div class="skill-detail-value">' + s.c + '</div></div>';
      html += '</div>';
      // Tags
      html += '<div style="margin-bottom:8px">';
      var paidTag = s.is_paid === '是' ? '<span class="skill-detail-tag paid">💰 付费</span>' : '<span class="skill-detail-tag free">🆓 免费</span>';
      var acctTag = s.depends_account === '是' ? '<span class="skill-detail-tag account">🔑 需要账号</span>' : '<span class="skill-detail-tag noaccount">🔓 无需账号</span>';
      html += paidTag + acctTag;
      html += '</div>';
      // Source URL
      html += '<div class="skill-detail-item" style="margin-bottom:8px"><div class="skill-detail-label">来源地址</div><div class="skill-detail-value">';
      if (srcUrl) {
        html += '<a href="' + srcUrl + '" target="_blank" rel="noopener">' + escapeHtml(srcUrl) + '</a>';
      } else {
        html += '-';
      }
      html += '</div></div>';
      // Homepage
      if (hp && hp !== '-') {
        html += '<div class="skill-detail-item" style="margin-bottom:8px"><div class="skill-detail-label">主页</div><div class="skill-detail-value">';
        html += '<a href="' + hp + '" target="_blank" rel="noopener">' + escapeHtml(hp) + '</a>';
        html += '</div></div>';
      }
      // Install command
      if (installCmd) {
        html += '<div class="skill-commands"><div class="skill-commands-label">安装命令</div>';
        html += '<code class="skill-command-code">' + escapeHtml(installCmd) + '</code>';
        html += '</div>';
      }
      // Use case
      if (s.use_case) {
        html += '<div class="skill-detail-extras">';
        html += '<div class="skill-detail-item"><div class="skill-detail-label">典型用途</div><div class="skill-detail-value">' + escapeHtml(s.use_case) + '</div></div>';
        html += '</div>';
      }
      // Quick commands
      if (cmd1) {
        html += '<div class="skill-commands"><div class="skill-commands-label">快速命令</div>';
        html += '<code class="skill-command-code">' + cmd1 + '</code>';
        if (cmd2) html += '<code class="skill-command-code">' + cmd2 + '</code>';
        html += '</div>';
      }
      html += '</div></div>';
    }
    grid.innerHTML = html;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  window.toggleCard = function(el) {
    var expanded = el.classList.contains('expanded');
    var cards = document.querySelectorAll('.skill-card.expanded');
    for (var i=0; i<cards.length; i++) cards[i].classList.remove('expanded');
    if (!expanded) el.classList.add('expanded');
  };

  window.copyInstallCmd = function(btn, cmd) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(cmd).then(function() {
        btn.textContent = '✅ 已复制';
        btn.classList.add('copied');
        setTimeout(function() {
          btn.textContent = '📋 复制安装命令';
          btn.classList.remove('copied');
        }, 2000);
      });
    } else {
      var ta = document.createElement('textarea');
      ta.value = cmd;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      btn.textContent = '✅ 已复制';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.textContent = '📋 复制安装命令';
        btn.classList.remove('copied');
      }, 2000);
    }
  };

  // Search
  document.getElementById('searchInput').addEventListener('input', function(e) {
    currentSearch = e.target.value;
    renderGrid();
  });

  // Init
  buildStats();
  buildFilters();
  renderGrid();
})();
</script>
</body>
</html>
