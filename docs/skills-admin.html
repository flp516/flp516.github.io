<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:#000;color:#e0e0e0;min-height:100vh}

/* Nav */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:48px;background:rgba(0,0,0,0.8);backdrop-filter:saturate(180%) blur(20px);display:flex;align-items:center;justify-content:center}
.nav-content{max-width:1400px;width:100%;padding:0 22px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:600;color:#fff;text-decoration:none}
.nav-links{display:flex;gap:28px;list-style:none}
.nav-links a{color:#fff;text-decoration:none;font-size:12px;transition:opacity .3s}
.nav-links a:hover{opacity:.7}
.nav-links a.active{color:#2997ff}

/* Toolbar */
.toolbar{position:fixed;top:48px;left:0;right:0;z-index:999;padding:10px 22px;background:rgba(0,0,0,0.9);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid rgba(255,255,255,.06);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar-title{font-size:14px;font-weight:600;color:#fff;margin-right:12px}
.toolbar-count{font-size:12px;color:rgba(255,255,255,.4);margin-right:auto}
.btn{padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#e0e0e0;font-size:12px;font-family:inherit;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.btn-primary{background:#2997ff;border-color:#2997ff;color:#fff}
.btn-primary:hover{background:#0077ed}
.btn-danger{color:#ff453a;border-color:rgba(255,69,58,.3)}
.btn-danger:hover{background:rgba(255,69,58,.1);border-color:rgba(255,69,58,.5)}
.btn-success{color:#34c759;border-color:rgba(52,199,89,.3)}
.btn-success:hover{background:rgba(52,199,89,.1);border-color:rgba(52,199,89,.5)}

/* Table Container */
.main{margin-top:100px;padding:12px 12px 40px}
.table-wrap{overflow-x:auto;border:1px solid rgba(255,255,255,.06);border-radius:10px;background:rgba(255,255,255,.02)}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:1400px}
th{position:sticky;top:100px;background:rgba(20,20,28,.98);padding:10px 8px;text-align:left;font-weight:600;color:rgba(255,255,255,.5);font-size:11px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;z-index:10}
td{padding:8px 8px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:top;color:rgba(255,255,255,.7);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative}
tr:hover td{background:rgba(255,255,255,.02)}
td input{width:100%;background:transparent;border:1px solid transparent;color:#fff;font-size:12px;font-family:inherit;padding:2px 4px;border-radius:4px;outline:none}
td input:focus{border-color:#2997ff;background:rgba(41,151,255,.05)}
td select{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);color:#e0e0e0;font-size:12px;padding:2px 4px;border-radius:4px;outline:none}
td select:focus{border-color:#2997ff}
td a{color:#2997ff;text-decoration:none;font-size:11px}
td a:hover{text-decoration:underline}
td .del-btn{opacity:0;background:none;border:none;color:#ff453a;cursor:pointer;font-size:14px;padding:2px 4px;transition:opacity .2s}
tr:hover td .del-btn{opacity:.6}
tr:hover td .del-btn:hover{opacity:1}
.row-new td{background:rgba(52,199,89,.03)}
.row-new td input{color:#34c759}

/* Empty State */
.empty{text-align:center;padding:60px;color:rgba(255,255,255,.25)}
.empty p{font-size:14px;margin-bottom:10px}
.empty button{font-size:13px;padding:8px 20px}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:13px;z-index:9999;display:none;pointer-events:none;transition:opacity .3s}
.toast.success{background:rgba(52,199,89,.9);color:#fff}
.toast.error{background:rgba(255,69,58,.9);color:#fff}
.toast.info{background:rgba(41,151,255,.9);color:#fff}

@media(max-width:768px){.toolbar{gap:5px} .btn{font-size:11px;padding:5px 10px} th,td{font-size:11px;padding:6px 4px} .main{margin-top:130px;padding:8px} th{top:130px}}

// ===== STATE =====
let data = [];

function loadData() {
  const saved = localStorage.getItem('skillsAdminData');
  if (saved) {
    try { data = JSON.parse(saved); return; } catch(e) {}
  }
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function saveData() {
  localStorage.setItem('skillsAdminData', JSON.stringify(data));
  document.getElementById('rowCount').textContent = data.length + ' 条记录';
}

// ===== RENDER =====
function render() {
  const tbody = document.getElementById('tableBody');
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="13"><div class="empty"><p>暂无数据</p><button class="btn btn-primary" onclick="loadDefaults()">📥 一键填充默认数据</button></div></td></tr>';
    return;
  }
  let html = '';
  data.forEach(function(row, i) {
    html += '<tr' + (row._new ? ' class="row-new"' : '') + '>';
    html += '<td>' + (i + 1) + '</td>';
    html += '<td><input type="text" value="' + esc(row.time) + '" onchange="updateField(' + i + ',\'time\',this.value)" placeholder="YYYY-MM-DD"></td>';
    html += '<td><input type="text" value="' + esc(row.ename) + '" onchange="updateField(' + i + ',\'ename\',this.value)" placeholder="英文名"></td>';
    html += '<td><input type="text" value="' + esc(row.cname) + '" onchange="updateField(' + i + ',\'cname\',this.value)" placeholder="中文名"></td>';
    html += '<td><input type="text" value="' + esc(row.source_name) + '" onchange="updateField(' + i + ',\'source_name\',this.value)" placeholder="来源名称"></td>';
    html += '<td><input type="text" value="' + esc(row.source_url) + '" onchange="updateField(' + i + ',\'source_url\',this.value)" placeholder="https://...">';
    if (row.source_url) html += '<br><a href="' + esc(row.source_url) + '" target="_blank" rel="noopener">打开 ↗</a>';
    html += '</td>';
    html += '<td><input type="text" value="' + esc(row.brief) + '" onchange="updateField(' + i + ',\'brief\',this.value)" placeholder="一句话描述"></td>';
    html += '<td><input type="text" value="' + esc(row.detail) + '" onchange="updateField(' + i + ',\'detail\',this.value)" placeholder="功能详情"></td>';
    html += '<td><input type="text" value="' + esc(row.author) + '" onchange="updateField(' + i + ',\'author\',this.value)" placeholder="企业/个人"></td>';
    html += '<td><select onchange="updateField(' + i + ',\'depends_account\',this.value)">';
    html += '<option value="否"' + (row.depends_account === '否' ? ' selected' : '') + '>否</option>';
    html += '<option value="是"' + (row.depends_account === '是' ? ' selected' : '') + '>是</option>';
    html += '</select></td>';
    html += '<td><select onchange="updateField(' + i + ',\'is_paid\',this.value)">';
    html += '<option value="否"' + (row.is_paid === '否' ? ' selected' : '') + '>否</option>';
    html += '<option value="是"' + (row.is_paid === '是' ? ' selected' : '') + '>是</option>';
    html += '</select></td>';
    html += '<td><input type="text" value="' + esc(row.use_case) + '" onchange="updateField(' + i + ',\'use_case\',this.value)" placeholder="使用案例"></td>';
    html += '<td><button class="del-btn" onclick="deleteRow(' + i + ')" title="删除">✕</button></td>';
    html += '</tr>';
  });
  tbody.innerHTML = html;
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

// ===== CRUD =====
function updateField(idx, field, val) {
  if (idx < 0 || idx >= data.length) return;
  data[idx][field] = val;
  saveData();
}

function addRow() {
  const now = new Date();
  const dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  data.push({id:data.length+1, time:dateStr, ename:'', cname:'', source_name:'', source_url:'', brief:'', detail:'', author:'', depends_account:'否', is_paid:'否', use_case:'', _new:true});
  saveData();
  render();
  // Scroll to bottom
  const wrap = document.querySelector('.table-wrap');
  wrap.scrollTop = wrap.scrollHeight;
  showToast('已添加新行 ✅', 'success');
}

function deleteRow(idx) {
  if (!confirm('确定删除第 ' + (idx+1) + ' 行？')) return;
  data.splice(idx, 1);
  saveData();
  render();
  showToast('已删除 ✅', 'info');
}

function clearData() {
  if (!confirm('确定清空所有数据？可通过"一键填充"恢复')) return;
  data = [];
  saveData();
  render();
  showToast('已清空', 'info');
}

function loadDefaults() {
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveData();
  render();
  showToast('已填充 ' + data.length + ' 条数据 ✅', 'success');
}

// ===== EXPORT =====
function exportExcel() {
  const headers = ['编号','录入时间','Skill英文名','中文名','技能来源','来源地址','一句话描述','功能详情','所属企业/个人','是否依赖账号','是否付费','使用典型案例'];
  const wsData = [headers];
  data.forEach(function(row, i) {
    wsData.push([i+1, row.time||'', row.ename||'', row.cname||'', row.source_name||'', row.source_url||'', row.brief||'', row.detail||'', row.author||'', row.depends_account||'否', row.is_paid||'否', row.use_case||'']);
  });
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  // Column widths
  ws['!cols'] = [{wch:6},{wch:12},{wch:30},{wch:18},{wch:18},{wch:35},{wch:35},{wch:40},{wch:18},{wch:12},{wch:10},{wch:35}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Skills');
  XLSX.writeFile(wb, 'skills_database.xlsx');
  showToast('已导出 ' + data.length + ' 条记录 📥', 'success');
}

// ===== TOAST =====
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  t.style.display = 'block';
  t.style.opacity = '1';
  setTimeout(function() { t.style.opacity = '0'; setTimeout(function() { t.style.display = 'none'; }, 300); }, 2000);
}

// ===== INIT =====
loadData();
render();
</script>
